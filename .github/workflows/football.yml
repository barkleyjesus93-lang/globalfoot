name: GlobalFoot Goal Memory Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect new goals
        run: |
          python - <<'PY'
          import requests
          import json
          import os

          STATE_FILE = "seen_goals.json"

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r") as f:
                  seen_goals = set(json.load(f))
          else:
              seen_goals = set()

          scoreboard_url = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/soccer/eng.1/scoreboard"
          )

          session = requests.Session()
          response = session.get(scoreboard_url, timeout=20)
          response.raise_for_status()

          data = response.json()

          new_goals = []
          updated_seen = set(seen_goals)

          for match in data.get("events", []):

              event_id = match.get("id")

              summary_url = (
                  "https://site.api.espn.com/apis/site/v2/"
                  f"sports/soccer/eng.1/summary?event={event_id}"
              )

              try:
                  r = session.get(summary_url, timeout=20)
                  r.raise_for_status()
                  summary = r.json()
              except requests.exceptions.RequestException:
                  continue

              for event in summary.get("keyEvents", []):

                  if event.get("scoringPlay") is not True:
                      continue

                  goal_id = f"{event_id}-{event.get('id')}"

                  if goal_id in seen_goals:
                      continue

                  minute = event.get("clock", {}).get(
                      "displayValue", "?"
                  )

                  team = event.get("team", {}).get(
                      "displayName",
                      "Équipe inconnue"
                  )

                  player = "Joueur inconnu"

                  participants = event.get(
                      "participants", []
                  )

                  if participants:
                      player = participants[0].get(
                          "athlete", {}
                      ).get(
                          "displayName",
                          "Joueur inconnu"
                      )

                  print(
                      f"🆕 NOUVEAU BUT | {minute} | "
                      f"{team} | {player}"
                  )

                  new_goals.append(goal_id)
                  updated_seen.add(goal_id)

          with open(STATE_FILE, "w") as f:
              json.dump(sorted(updated_seen), f, indent=2)

          print("\nNouveaux buts :", len(new_goals))
          print("Mémoire totale :", len(updated_seen))
          PY

      - name: Save goal memory
        run: |
          git config user.name "GlobalFoot Bot"
          git config user.email "actions@github.com"

          git add seen_goals.json

          if git diff --cached --quiet; then
            echo "Aucun nouveau but à mémoriser."
          else
            git commit -m "Update goal memory"
            git push
          fi
