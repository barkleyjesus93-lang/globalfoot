name: GlobalFoot All Matches Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Detect goals in all matches
        run: |
          python - <<'PY'
          import requests
          import time

          scoreboard_url = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/soccer/eng.1/scoreboard"
          )

          session = requests.Session()

          response = session.get(
              scoreboard_url,
              timeout=20
          )
          response.raise_for_status()

          data = response.json()

          print("MATCHS TROUVÉS :", len(data.get("events", [])))

          total_goals = 0

          for match in data.get("events", []):

              event_id = match.get("id")
              match_name = match.get("name")

              print("\n==============================")
              print("MATCH :", match_name)

              summary_url = (
                  "https://site.api.espn.com/apis/site/v2/"
                  f"sports/soccer/eng.1/summary?event={event_id}"
              )

              try:
                  summary_response = session.get(
                      summary_url,
                      timeout=20
                  )
                  summary_response.raise_for_status()

                  summary = summary_response.json()

              except requests.exceptions.RequestException as error:
                  print("⚠️ ERREUR ESPN :", error)
                  print("➡️ Match ignoré, le workflow continue.")
                  continue

              match_goals = 0

              for event in summary.get("keyEvents", []):

                  if event.get("scoringPlay") is True:

                      match_goals += 1
                      total_goals += 1

                      minute = event.get(
                          "clock", {}
                      ).get(
                          "displayValue", "?"
                      )

                      team = event.get(
                          "team", {}
                      ).get(
                          "displayName",
                          "Équipe inconnue"
                      )

                      participants = event.get(
                          "participants", []
                      )

                      player = "Joueur inconnu"

                      if participants:
                          player = participants[0].get(
                              "athlete", {}
                          ).get(
                              "displayName",
                              "Joueur inconnu"
                          )

                      print(
                          f"⚽ BUT | {minute} | "
                          f"{team} | {player}"
                      )

              print(
                  "Buts détectés dans ce match :",
                  match_goals
              )

              time.sleep(1)

          print("\n==============================")
          print("TOTAL DES BUTS :", total_goals)
          PY
