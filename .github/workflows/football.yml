name: GlobalFoot Goal Diagnostic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect ESPN summary
        run: |
          python - <<'PY'
          import requests
          import json

          event_id = "401879022"

          url = (
              "https://site.api.espn.com/apis/site/v2/"
              f"sports/soccer/eng.1/summary?event={event_id}"
          )

          response = requests.get(url, timeout=20)
          response.raise_for_status()

          data = response.json()

          print("=== CLÉS PRINCIPALES ===")
          print(list(data.keys()))

          print("\n=== PLAYS ===")
          print("Nombre :", len(data.get("plays", [])))

          print("\n=== KEY EVENTS ===")
          print("Nombre :", len(data.get("keyEvents", [])))

          print("\n=== PREMIER KEY EVENT ===")
          if data.get("keyEvents"):
              print(json.dumps(data["keyEvents"][0], indent=2)[:5000])

          print("\n=== PREMIER PLAY ===")
          if data.get("plays"):
              print(json.dumps(data["plays"][0], indent=2)[:5000])
          PY
