name: GlobalFoot ESPN Events Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect ESPN events
        run: |
          python - <<'PY'
          import requests
          import json

          url = "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"

          response = requests.get(url, timeout=20)
          response.raise_for_status()

          data = response.json()

          for event in data.get("events", []):
              print("\n==============================")
              print("MATCH:", event.get("name"))
              print("ID:", event.get("id"))

              print("\nDETAILS:")
              print(json.dumps(event, indent=2)[:8000])
          PY
