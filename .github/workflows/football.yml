name: GlobalFoot Goal Diagnostic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Detect ESPN goals
        run: |
          python - <<'PY'
          import requests

          event_id = "401879022"

          url = (
              "https://site.api.espn.com/apis/site/v2/"
              f"sports/soccer/eng.1/summary?event={event_id}"
          )

          response = requests.get(url, timeout=20)
          response.raise_for_status()

          data = response.json()

          print("=== ESPN KEY EVENTS ===")

          goals = 0

          for event in data.get("keyEvents", []):
              if event.get("scoringPlay") is True:
                  goals += 1

                  minute = event.get("clock", {}).get(
                      "displayValue", "?"
                  )

                  text = event.get(
                      "text", "But détecté"
                  )

                  team = event.get(
                      "team", {}
                  ).get(
                      "displayName", "Équipe inconnue"
                  )

                  participants = event.get(
                      "participants", []
                  )

                  player = "Joueur inconnu"

                  if participants:
                      player = participants[0].get(
                          "athlete", {}
                      ).get(
                          "displayName",
                          "Joueur inconnu"
                      )

                  print(
                      f"⚽ BUT | {minute} | "
                      f"{team} | {player} | {text}"
                  )

          print("\nNombre de buts détectés :", goals)
          PY
