
name: GlobalFoot Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  globalfoot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect and publish new goals
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          python - <<'PY'
          import requests
          import json
          import os

          STATE_FILE = "seen_goals.json"
          PAGE_ID = "987662881093953"

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r") as f:
                  seen_goals = set(json.load(f))
          else:
              seen_goals = set()

          scoreboard_url = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/soccer/eng.1/scoreboard"
          )

          session = requests.Session()

          response = session.get(
              scoreboard_url,
              timeout=20
          )
          response.raise_for_status()

          data = response.json()

          updated_seen = set(seen_goals)
          new_count = 0

          for match in data.get("events", []):

              event_id = match.get("id")
              match_name = match.get(
                  "name",
                  "Match inconnu"
              )

              summary_url = (
                  "https://site.api.espn.com/apis/site/v2/"
                  f"sports/soccer/eng.1/summary?event={event_id}"
              )

              try:
                  r = session.get(
                      summary_url,
                      timeout=20
                  )
                  r.raise_for_status()
                  summary = r.json()

              except requests.exceptions.RequestException as error:
                  print("⚠️ Match ignoré :", error)
                  continue

              for event in summary.get("keyEvents", []):

                  if event.get("scoringPlay") is not True:
                      continue

                  goal_id = f"{event_id}-{event.get('id')}"

                  if goal_id in seen_goals:
                      continue

                  minute = event.get(
                      "clock", {}
                  ).get(
                      "displayValue",
                      "?"
                  )

                  team = event.get(
                      "team", {}
                  ).get(
                      "displayName",
                      "Équipe inconnue"
                  )

                  player = "Joueur inconnu"

                  participants = event.get(
                      "participants",
                      []
                  )

                  if participants:
                      player = participants[0].get(
                          "athlete",
                          {}
                      ).get(
                          "displayName",
                          "Joueur inconnu"
                      )

                  message = (
                      f"⚽ BUT EN DIRECT !\n\n"
                      f"🏆 {match_name}\n"
                      f"⚽ {team}\n"
                      f"👤 {player}\n"
                      f"⏱️ {minute}\n\n"
                      f"🌍 GlobalFoot"
                  )

                  print("\n🆕 NOUVEAU BUT")
                  print(message)

                  facebook_url = (
                      f"https://graph.facebook.com/v26.0/"
                      f"{PAGE_ID}/feed"
                  )

                  try:
                      fb_response = session.post(
                          facebook_url,
                          data={
                              "message": message,
                              "access_token": os.environ[
                                  "FACEBOOK_PAGE_TOKEN"
                              ]
                          },
                          timeout=20
                      )

                      fb_response.raise_for_status()

                      fb_data = fb_response.json()

                      print(
                          "✅ Publication Facebook réussie :",
                          fb_data
                      )

                      updated_seen.add(goal_id)
                      new_count += 1

                  except requests.exceptions.RequestException as error:
                      print(
                          "❌ Publication Facebook échouée :",
                          error
                      )
                      continue

          with open(STATE_FILE, "w") as f:
              json.dump(
                  sorted(updated_seen),
                  f,
                  indent=2
              )

          print("\n==============================")
          print("Nouvelles publications :", new_count)
          print("Mémoire totale :", len(updated_seen))
          PY

      - name: Save goal memory
        run: |
          git config user.name "GlobalFoot Bot"
          git config user.email "actions@github.com"

          git add seen_goals.json

          if git diff --cached --quiet; then
            echo "Aucune nouvelle mémoire à sauvegarder."
          else
            git commit -m "Update goal memory"
            git push
          fi
