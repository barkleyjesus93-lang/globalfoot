name: GlobalFoot Goal Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Detect goals
        run: |
          python - <<'PY'
          import requests

          scoreboard_url = "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"

          response = requests.get(scoreboard_url, timeout=20)
          response.raise_for_status()

          data = response.json()

          for event in data.get("events", []):
              event_id = event.get("id")
              match_name = event.get("name")

              summary_url = (
                  "https://site.api.espn.com/apis/site/v2/"
                  f"sports/soccer/eng.1/summary?event={event_id}"
              )

              summary_response = requests.get(summary_url, timeout=20)
              summary_response.raise_for_status()

              summary = summary_response.json()

              print("\nMATCH:", match_name)

              for play in summary.get("plays", []):
                  if play.get("scoringPlay"):
                      clock = play.get("clock", {}).get("displayValue", "?")
                      text = play.get("text", "But détecté")

                      print("⚽ BUT |", clock, "|", text)
          PY
