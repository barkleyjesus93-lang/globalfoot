name: GlobalFoot Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

jobs:
  globalfoot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect and publish new goals
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          STATE_FILE = "seen_goals.json"
          PAGE_ID = "987662881093953"

          ESPN_URL = "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"

          try:
              with open(STATE_FILE, "r") as f:
                  seen_goals = set(json.load(f))
          except FileNotFoundError:
              seen_goals = set()

          updated_seen = set(seen_goals)
          new_count = 0

          data = requests.get(ESPN_URL).json()

          for match in data.get("events", []):
              event_id = match.get("id")
              match_name = match.get("name", "")

              summary_url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event={event_id}"

              try:
                  summary = requests.get(summary_url).json()
              except Exception:
                  continue

              for event in summary.get("keyEvents", []):

                  if event.get("scoringPlay") is not True:
                      continue

                  goal_id = f"{event_id}-{event.get('id')}"

                  if goal_id in seen_goals:
                      continue

                  minute = event.get("clock", {}).get("displayValue", "")
                  team = event.get("team", {}).get("displayName", "")

                  participants = event.get("participants", [])

                  player = "Buteur inconnu"

                  if participants:
                      athlete = participants[0].get("athlete", {})
                      player = athlete.get("displayName", "Buteur inconnu")

                  message = f"""⚽ BUT EN DIRECT !

🏟️ {match_name}
👕 {team}
⚽ {player}
⏱️ {minute}

🌍 GlobalFoot"""

                  print("🔥 NOUVEAU BUT")
                  print(message)

                  try:
                      response = requests.post(
                          f"https://graph.facebook.com/v26.0/{PAGE_ID}/feed",
                          data={
                              "message": message,
                              "access_token": os.environ["FACEBOOK_PAGE_TOKEN"]
                          }
                      )

                      if response.ok:
                          print("Publication Facebook réussie")
                          updated_seen.add(goal_id)
                          new_count += 1
                      else:
                          print("Publication Facebook échouée")
                          print(response.text)

                  except Exception as e:
                      print("Erreur Facebook :", e)

          with open(STATE_FILE, "w") as f:
              json.dump(sorted(updated_seen), f, indent=2)

          print(f"Nouvelles publications : {new_count}")
          print(f"Mémoire totale : {len(updated_seen)}")
          PY

      - name: Save goal memory
        run: |
          git config user.name "GlobalFoot Bot"
          git config user.email "actions@github.com"
          git add seen_goals.json

          if git diff --cached --quiet; then
            echo "Aucune nouvelle mémoire à sauvegarder."
          else
            git commit -m "Update goal memory"
            git push
          fi
